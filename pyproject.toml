[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sam3_api"]

[project]
name = "sam3-serve"
version = "0.1.0"
description = "SAM3 image segmentation service (GPU/CPU) with a FastAPI endpoint"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers>=5.0",
    "accelerate",
    "safetensors",
    "pillow",
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "modelscope",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
